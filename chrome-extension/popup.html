<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Charlie AI Monitor</title>
  <style>
    body {
      width: 280px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      margin: 0;
    }
    h2 {
      font-size: 16px;
      margin-top: 0;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    label {
      font-size: 12px;
      color: #94a3b8;
      display: block;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #0369a1;
    }
    .status {
      margin-top: 12px;
      font-size: 11px;
      color: #64748b;
      border-top: 1px solid #334155;
      padding-top: 8px;
    }
  </style>
</head>
<body>
  <h2><span>⚡</span> Charlie Monitor</h2>
  <label for="webAppUrl">Google Apps Script Web App URL:</label>
  <input type="text" id="webAppUrl" placeholder="https://script.google.com/macros/s/.../exec">
  <button id="saveBtn">Save Settings</button>

  <div class="status">
    <div>Status: <strong style="color: #4ade80;">Active Monitoring</strong></div>
    <div>Last Topic: <span id="lastTopic">None</span></div>
    <div>Total Synced: <span id="syncCount">0</span></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
